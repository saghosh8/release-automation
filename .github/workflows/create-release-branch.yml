name: Create Release Branches

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
        type: string

      release_number:
        description: "Release number"
        required: true
        type: string

      app_repos:
        description: "Comma-separated list of application repository names"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release-branches:
    name: Create Release Branches
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Read release inputs
      # ---------------------------------------------------------
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          APP_REPOS: ${{ inputs.app_repos }}
        run: |
          echo "Release Name   : ${RELEASE_NAME}"
          echo "Release Number : ${RELEASE_NUMBER}"
          echo "Application Repos: ${APP_REPOS}"

      # ---------------------------------------------------------
      # 2. Detect organization
      # ---------------------------------------------------------
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"

          echo "Organization: ${ORGANIZATION}"

          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Validate PAT
      # ---------------------------------------------------------
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          echo "GitHub authentication token configured successfully."

      # ---------------------------------------------------------
      # 4. Generate branch name
      # ---------------------------------------------------------
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          BRANCH_NAME="release/${RELEASE_NAME}-${RELEASE_NUMBER}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 5. Create branches for all applications
      # ---------------------------------------------------------
      - name: Create Release Branches for Applications
        shell: bash
        env:
          ORGANIZATION: ${{ env.ORGANIZATION }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          APP_REPOS: ${{ inputs.app_repos }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          # Convert comma-separated string to array and process each app
          IFS=',' read -ra APPS <<< "${APP_REPOS}"
          
          declare -A app_results
          
          for app in "${APPS[@]}"; do
            app=$(echo "$app" | xargs)  # Trim whitespace
            
            echo "Processing: ${app}"
            
            # Create temporary directory for this app
            temp_dir="/tmp/${app}"
            mkdir -p "${temp_dir}"
            
            # Checkout repository
            if git clone --depth 1 --branch main "https://x-access-token:${RELEASE_AUTOMATION_TOKEN}@github.com/${ORGANIZATION}/${app}.git" "${temp_dir}" 2>&1; then
              cd "${temp_dir}"
              
              # Create and push release branch
              if git checkout -b "${BRANCH_NAME}" && git push origin "${BRANCH_NAME}" 2>&1; then
                app_results["${app}"]="success"
                echo "✅ Successfully created branch for ${app}"
              else
                app_results["${app}"]="failed"
                echo "❌ Failed to create branch for ${app}"
              fi
              
              cd - > /dev/null
            else
              app_results["${app}"]="failed"
              echo "❌ Failed to clone ${app}"
            fi
            
            # Cleanup
            rm -rf "${temp_dir}"
          done
          
          # Save results for summary step
          echo "APP_RESULTS<<EOF" >> "$GITHUB_ENV"
          for app in "${!app_results[@]}"; do
            echo "${app}:${app_results[${app}]}" >> "$GITHUB_ENV"
          done
          echo "EOF" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. GitHub Actions Job Summary
      # ---------------------------------------------------------
      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          APP_REPOS: ${{ inputs.app_repos }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # 🚀 Release Branch Creation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Name | `${RELEASE_NAME}` |
          | Release Number | `${RELEASE_NUMBER}` |
          | Organization | `${ORGANIZATION}` |
          | Source Branch | `main` |
          | Release Branch | `${BRANCH_NAME}` |

          ## Repositories Processed

          | Repository | Status |
          |---|---|
          EOF
          
          IFS=',' read -ra APPS <<< "${APP_REPOS}"
          for app in "${APPS[@]}"; do
            app=$(echo "$app" | xargs)
            echo "| \`${app}\` | ✅ Processed |" >> "$GITHUB_STEP_SUMMARY"
          done
          
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ## Actions Performed

          - ✅ Release inputs received
          - ✅ Organization detected automatically
          - ✅ GitHub authentication validated
          - ✅ Release branch generated
          EOF
          
          for app in "${APPS[@]}"; do
            app=$(echo "$app" | xargs)
            echo "- ✅ Branch created and pushed for **${app}**" >> "$GITHUB_STEP_SUMMARY"
          done
          
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          > **Note:** No application files were modified in this workflow. This stage only creates the release branches.
          EOF
