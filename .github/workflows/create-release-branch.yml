name: Create Release Branch for All Applications

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
        type: string

      release_number:
        description: "Release number"
        required: true
        type: string

      applications:
        description: "Applications to include (comma-separated, e.g. application-one,application-two)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release-branches:
    name: Create Release Branches
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Read Release Inputs
      # ---------------------------------------------------------
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          APPLICATIONS: ${{ inputs.applications }}
        run: |
          echo "Release Name   : ${RELEASE_NAME}"
          echo "Release Number : ${RELEASE_NUMBER}"
          echo "Applications   : ${APPLICATIONS}"

      # ---------------------------------------------------------
      # 2. Detect Organization
      # ---------------------------------------------------------
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"
          echo "Organization: ${ORGANIZATION}"
          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Validate PAT
      # ---------------------------------------------------------
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi
          echo "GitHub authentication token configured successfully."

      # ---------------------------------------------------------
      # 4. Generate Release Branch Name
      # ---------------------------------------------------------
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          BRANCH_NAME="release/${RELEASE_NAME}_${RELEASE_NUMBER}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"
          echo "Release Branch: ${BRANCH_NAME}"

      # ---------------------------------------------------------
      # 5. Create Release Branches for All Applications
      # ---------------------------------------------------------
      - name: Create Release Branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          set -e

          IFS=',' read -ra APPS <<< "${APPLICATIONS}"

          for REPO in "${APPS[@]}"; do

            REPO=$(echo "${REPO}" | xargs)

            echo ""
            echo "======================================"
            echo "Processing: ${REPO}"
            echo "Release Branch: ${BRANCH_NAME}"
            echo "======================================"

            # ---------------------------------------------------
            # Checkout repository
            # ---------------------------------------------------
            echo "Checking out repository..."

            gh repo clone "${ORGANIZATION}/${REPO}" "${REPO}" -- --branch main

            cd "${REPO}"

            # ---------------------------------------------------
            # Create and push release branch
            # ---------------------------------------------------
            echo "Creating release branch..."

            git checkout -b "${BRANCH_NAME}"
            git push origin "${BRANCH_NAME}"

            echo "✅ Release branch created and pushed for ${REPO}"

            cd ..

          done

      # ---------------------------------------------------------
      # 6. Generate Release Summary
      # ---------------------------------------------------------
      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          APPLICATIONS: ${{ inputs.applications }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🚀 Release Branch Creation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Name | \`${RELEASE_NAME}\` |
          | Release Number | \`${RELEASE_NUMBER}\` |
          | Organization | \`${ORGANIZATION}\` |
          | Source Branch | \`main\` |
          | Release Branch | \`${BRANCH_NAME}\` |
          | Applications | \`${APPLICATIONS}\` |

          ## Actions Performed

          - ✅ Release inputs received
          - ✅ Organization detected automatically
          - ✅ GitHub authentication validated
          - ✅ Release branch name generated
          - ✅ Release branches created and pushed for all applications

          > **Note:** No application files were modified in this workflow. This stage only creates the release branches.
          EOF
