name: Create Release Branches

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
        type: string

      release_number:
        description: "Release number"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release-branches:
    name: Create Release Branches
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Read release inputs
      # ---------------------------------------------------------
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          echo "Release Name   : ${RELEASE_NAME}"
          echo "Release Number : ${RELEASE_NUMBER}"

      # ---------------------------------------------------------
      # 2. Detect organization
      # ---------------------------------------------------------
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"

          echo "Organization: ${ORGANIZATION}"

          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Validate PAT
      # ---------------------------------------------------------
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          echo "GitHub authentication token configured successfully."

      # ---------------------------------------------------------
      # 4. Checkout Application One
      # ---------------------------------------------------------
      - name: Checkout Application One
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORGANIZATION }}/application-one
          ref: main
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          path: application-one

      # ---------------------------------------------------------
      # Checkout Application Two
      # ---------------------------------------------------------
      - name: Checkout Application Two
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORGANIZATION }}/application-two
          ref: main
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          path: application-two

      # ---------------------------------------------------------
      # 5. Generate branch name
      # ---------------------------------------------------------
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          BRANCH_NAME="release/${RELEASE_NAME}-${RELEASE_NUMBER}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Create branch - Application One
      # ---------------------------------------------------------
      - name: Create Release Branch - Application One
        id: app1
        working-directory: application-one
        shell: bash
        run: |
          git checkout -b "${BRANCH_NAME}"
          git push origin "${BRANCH_NAME}"

          echo "APP1_STATUS=SUCCESS" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Create branch - Application Two
      # ---------------------------------------------------------
      - name: Create Release Branch - Application Two
        id: app2
        working-directory: application-two
        shell: bash
        run: |
          git checkout -b "${BRANCH_NAME}"
          git push origin "${BRANCH_NAME}"

          echo "APP2_STATUS=SUCCESS" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 7. GitHub Actions Job Summary
      # ---------------------------------------------------------
      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          APP1_RESULT: ${{ steps.app1.outcome }}
          APP2_RESULT: ${{ steps.app2.outcome }}
        run: |
          if [[ "${APP1_RESULT}" == "success" ]]; then
            APP1_STATUS="✅ Success"
          else
            APP1_STATUS="❌ Failed"
          fi

          if [[ "${APP2_RESULT}" == "success" ]]; then
            APP2_STATUS="✅ Success"
          else
            APP2_STATUS="❌ Failed"
          fi

          if [[ "${APP1_RESULT}" == "success" && "${APP2_RESULT}" == "success" ]]; then
            OVERALL_STATUS="✅ Release branch creation completed successfully"
          else
            OVERALL_STATUS="❌ Release branch creation failed"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🚀 Release Branch Creation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Name | \`${RELEASE_NAME}\` |
          | Release Number | \`${RELEASE_NUMBER}\` |
          | Organization | \`${ORGANIZATION}\` |
          | Source Branch | \`main\` |
          | Release Branch | \`${BRANCH_NAME}\` |

          ## Repository Results

          | Repository | Source | Release Branch | Status |
          |---|---|---|---|
          | application-one | \`main\` | \`${BRANCH_NAME}\` | ${APP1_STATUS} |
          | application-two | \`main\` | \`${BRANCH_NAME}\` | ${APP2_STATUS} |

          ## Overall Result

          ${OVERALL_STATUS}

          ## Actions Performed

          - ✅ Release inputs received
          - ✅ Organization detected automatically
          - ✅ GitHub authentication validated
          - ✅ Application repositories checked out
          - ✅ Release branch generated
          - ${APP1_STATUS} Branch created and pushed for **application-one**
          - ${APP2_STATUS} Branch created and pushed for **application-two**

          > **Note:** No application files were modified in this workflow. This stage only creates the release branches.
          EOF
