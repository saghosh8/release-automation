name: Create Release Notes

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

      applications:
        description: "Applications to include (comma-separated, e.g. application-one,application-two)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release-notes:
    name: Create Draft Release
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Read Release Inputs
      # ---------------------------------------------------------
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
        run: |
          echo "Release Version : ${RELEASE_VERSION}"
          echo "Applications     : ${APPLICATIONS}"

      # ---------------------------------------------------------
      # 2. Detect Organization
      # ---------------------------------------------------------
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"

          echo "Organization: ${ORGANIZATION}"

          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Validate PAT
      # ---------------------------------------------------------
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          echo "GitHub authentication token configured successfully."

      # ---------------------------------------------------------
      # 4. Generate Release Branch Name
      # ---------------------------------------------------------
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          RELEASE_BRANCH="release/SG_RELEASE_${RELEASE_VERSION}"

          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"

          echo "Release Branch: ${RELEASE_BRANCH}"

      # ---------------------------------------------------------
      # 5. Process Applications
      # ---------------------------------------------------------
      - name: Create Draft Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |

          set -e

          IFS=',' read -ra APPS <<< "${APPLICATIONS}"

          for REPO in "${APPS[@]}"; do

            REPO=$(echo "${REPO}" | xargs)

            echo ""
            echo "======================================"
            echo "Processing: ${REPO}"
            echo "Release Branch: ${RELEASE_BRANCH}"
            echo "======================================"

            # ---------------------------------------------------
            # Check Release Branch
            # ---------------------------------------------------
            echo "Checking release branch..."

            gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/heads/${RELEASE_BRANCH}" \
              > /dev/null

            echo "Release branch exists."

            # ---------------------------------------------------
            # Get MAIN commit
            # ---------------------------------------------------
            echo "Getting main branch commit..."

            OLD_COMMIT=$(gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/heads/main" \
              --jq '.object.sha')

            echo "Old Commit: ${OLD_COMMIT}"

            # ---------------------------------------------------
            # Get RELEASE branch commit
            # ---------------------------------------------------
            echo "Getting release branch commit..."

            NEW_COMMIT=$(gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/heads/${RELEASE_BRANCH}" \
              --jq '.object.sha')

            echo "New Commit: ${NEW_COMMIT}"

            # ---------------------------------------------------
            # Generate Release Tag
            # ---------------------------------------------------
            TAG="${RELEASE_VERSION}-release-${NEW_COMMIT}"

            echo "Release Tag: ${TAG}"

            # ---------------------------------------------------
            # Generate GitHub Release Notes
            # ---------------------------------------------------
            echo "Generating release notes..."

            RELEASE_NOTES=$(gh api \
              "repos/${ORGANIZATION}/${REPO}/releases/generate-notes" \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${RELEASE_BRANCH}" \
              --jq '.body')

            # ---------------------------------------------------
            # Create Draft Release
            # ---------------------------------------------------
            echo "Creating draft release..."

            gh api \
              "repos/${ORGANIZATION}/${REPO}/releases" \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${RELEASE_BRANCH}" \
              -f "name=${RELEASE_VERSION}" \
              -f "body=${RELEASE_NOTES}" \
              -F draft=true

            echo "✅ Draft release created successfully for ${REPO}"

          done

      # ---------------------------------------------------------
      # 6. Generate Job Summary
      # ---------------------------------------------------------
      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🚀 Release Notes Generation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Version | \`${RELEASE_VERSION}\` |
          | Organization | \`${ORGANIZATION}\` |
          | Release Branch | \`${RELEASE_BRANCH}\` |
          | Applications | \`${APPLICATIONS}\` |

          ## Actions Performed

          - ✅ Release version received
          - ✅ Organization detected
          - ✅ Release branch identified
          - ✅ Main branch commit identified
          - ✅ Release branch commit identified
          - ✅ Release tag generated
          - ✅ GitHub release notes generated
          - ✅ Draft GitHub Release created
          EOF
