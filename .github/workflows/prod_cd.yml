name: Trigger CD - Prod Pipeline

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch name, e.g. release/SG_RELEASE_1.0.0"
        required: true
        type: string
      repo_tags:
        description: "Comma-separated repo:newTag pairs, e.g. application-one:2.0.0-release-273b809,application-two:2.0.0-release-4b78c40"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  trigger-cd-prod:
    name: Trigger CD - Prod
    runs-on: ubuntu-latest
    steps:
      # ==========================================================
      # 1. Validate inputs
      # ==========================================================
      - name: Validate input
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_BRANCH="${{ inputs.release_branch }}"
          echo "Release branch: $RELEASE_BRANCH"

          if [[ -z "$RELEASE_BRANCH" ]]; then
            echo "::error::Release branch input cannot be empty."
            exit 1
          fi

          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> "$GITHUB_ENV"

      # ==========================================================
      # 2. Validate repo_tags input
      # ==========================================================
      - name: Validate repo_tags input
        shell: bash
        run: |
          set -euo pipefail

          REPO_TAGS_INPUT="${{ inputs.repo_tags }}"

          if [[ -z "$REPO_TAGS_INPUT" ]]; then
            echo "::error::repo_tags input cannot be empty."
            echo "::error::Expected format: repo1:newTag1,repo2:newTag2"
            exit 1
          fi

          echo "Input received:"
          echo "$REPO_TAGS_INPUT" | tr ',' '\n' | sed '/^[[:space:]]*$/d'

      # ==========================================================
      # 3. Parse input and trigger pipelines
      # ==========================================================
      - name: Trigger CD - Prod pipelines
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          RELEASE_BRANCH="$RELEASE_BRANCH"
          REPO_TAGS_INPUT="${{ inputs.repo_tags }}"

          echo "Parsing repo_tags input..."
          echo ""

          while IFS=':' read -r REPO_NAME IMAGE_TAG; do
            # Trim whitespace
            REPO_NAME="$(echo "$REPO_NAME" | xargs)"
            IMAGE_TAG="$(echo "$IMAGE_TAG" | xargs)"

            # Skip empty lines and comments
            if [[ -z "$REPO_NAME" ]] || [[ "$REPO_NAME" =~ ^# ]]; then
              continue
            fi

            if [[ -z "$IMAGE_TAG" ]]; then
              echo "::error::Image tag not specified for repository: $REPO_NAME"
              exit 1
            fi

            echo "############################################################"
            echo "Processing repository: $REPO_NAME"
            echo "Image tag    : $IMAGE_TAG"
            echo "Environment  : prod"
            echo "############################################################"

            # ====================================================
            # Resolve repository
            # ====================================================
            echo ""
            echo "Resolving repository..."
            REPO_FULL_NAME=$(gh repo view "$REPO_NAME" \
              --json nameWithOwner \
              --jq '.nameWithOwner') || {
              echo "::error::Repository does not exist or token has no access."
              echo "::error::Repository: $REPO_NAME"
              exit 1
            }

            if [[ -z "$REPO_FULL_NAME" || "$REPO_FULL_NAME" == "null" ]]; then
              echo "::error::Could not resolve repository."
              exit 1
            fi
            echo "Repository: $REPO_FULL_NAME"

            # ====================================================
            # Verify CD - Prod workflow exists
            # ====================================================
            echo ""
            echo "Verifying CD - Prod workflow..."

            WORKFLOW_FOUND=$(gh workflow list \
              --repo "$REPO_FULL_NAME" \
              --all \
              --json name \
              --jq '.[] | select(.name == "CD - Prod") | .name' || true)

            if [[ -z "$WORKFLOW_FOUND" ]]; then
              echo "::error::CD - Prod workflow not found."
              echo "::error::Repository: $REPO_FULL_NAME"
              exit 1
            fi

            echo "CD - Prod workflow found."

            # ====================================================
            # Trigger CD - Prod workflow
            # ====================================================
            echo ""
            echo "Triggering CD - Prod workflow..."

            gh workflow run "CD - Prod" \
              --repo "$REPO_FULL_NAME" \
              --ref "$RELEASE_BRANCH" \
              -f "release_tag=$IMAGE_TAG"

            echo "Workflow trigger request submitted."
            echo "Repository: $REPO_FULL_NAME"
            echo "Workflow  : CD - Prod"
            echo "Branch    : $RELEASE_BRANCH"
            echo "Inputs    :"
            echo "  - release_tag: $IMAGE_TAG"
            echo ""
            echo "############################################################"
            echo "TRIGGER SUCCESSFUL"
            echo "############################################################"
            echo ""

          done < <(echo "$REPO_TAGS_INPUT" | tr ',' '\n')

          echo "All pipelines triggered successfully."
