name: Create Release Notes

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        type: string

      applications:
        description: "Applications to release (comma-separated)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release-notes:
    name: Create and Publish Releases
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Read Release Information
      # ---------------------------------------------------------
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
        run: |
          echo "Release Version : ${RELEASE_VERSION}"
          echo "Applications     : ${APPLICATIONS}"

      # ---------------------------------------------------------
      # 2. Detect Organization
      # ---------------------------------------------------------
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"

          echo "Organization: ${ORGANIZATION}"

          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 3. Validate PAT
      # ---------------------------------------------------------
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          echo "GitHub authentication token configured successfully."

      # ---------------------------------------------------------
      # 4. Generate Release Branch
      # ---------------------------------------------------------
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          RELEASE_BRANCH="release/SG_RELEASE_${RELEASE_VERSION}"

          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"

          echo "Release Branch: ${RELEASE_BRANCH}"

      # ---------------------------------------------------------
      # 5. Create Releases
      # ---------------------------------------------------------
      - name: Create GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |

          set -e

          IFS=',' read -ra APPS <<< "${APPLICATIONS}"

          for REPO in "${APPS[@]}"; do

            REPO=$(echo "${REPO}" | xargs)

            echo ""
            echo "======================================"
            echo "Processing: ${REPO}"
            echo "Release Branch: ${RELEASE_BRANCH}"
            echo "======================================"

            # ---------------------------------------------------
            # Get release branch commit
            # ---------------------------------------------------
            NEW_COMMIT=$(gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/heads/${RELEASE_BRANCH}" \
              --jq '.object.sha')

            SHORT_COMMIT="${NEW_COMMIT:0:7}"

            echo "New Commit      : ${NEW_COMMIT}"
            echo "Short Commit    : ${SHORT_COMMIT}"

            # ---------------------------------------------------
            # Create new release tag
            # Example:
            # 1.0.1-release-6c4db90
            # ---------------------------------------------------
            NEW_TAG="${RELEASE_VERSION}-release-${SHORT_COMMIT}"

            echo "New Tag: ${NEW_TAG}"

            # ---------------------------------------------------
            # Check if tag already exists
            # ---------------------------------------------------
            if gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/tags/${NEW_TAG}" \
              > /dev/null 2>&1; then

              echo "Tag ${NEW_TAG} already exists."

            else

              echo "Creating tag ${NEW_TAG}..."

              gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/git/refs" \
                -f "ref=refs/tags/${NEW_TAG}" \
                -f "sha=${NEW_COMMIT}"

              echo "Tag created successfully."

            fi

            # ---------------------------------------------------
            # Find previous tag
            # ---------------------------------------------------
            echo "Finding previous tag..."

            OLD_TAG=""
            if gh api "repos/${ORGANIZATION}/${REPO}/releases/latest" --jq '.tag_name' > /tmp/latest_tag.txt 2>/dev/null; then
              OLD_TAG=$(cat /tmp/latest_tag.txt)
              echo "Previous Tag: ${OLD_TAG}"
            else
              echo "No previous release found. This is the first release."
            fi

            # ---------------------------------------------------
            # Generate Release Notes
            # ---------------------------------------------------
            echo "Generating release notes..."

            if [[ -z "${OLD_TAG}" ]]; then
              # First release - generate notes without previous tag
              RELEASE_NOTES=$(gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/releases/generate-notes" \
                -f "tag_name=${NEW_TAG}" \
                -f "target_commitish=main" \
                --jq '.body')
            else
              # Subsequent release - generate notes since previous tag
              RELEASE_NOTES=$(gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/releases/generate-notes" \
                -f "tag_name=${NEW_TAG}" \
                -f "target_commitish=main" \
                -f "previous_tag_name=${OLD_TAG}" \
                --jq '.body')
            fi

            echo "Release notes generated."

            # ---------------------------------------------------
            # Create and Publish Release
            # ---------------------------------------------------
            echo "Creating GitHub Release..."

            gh api \
              --method POST \
              "repos/${ORGANIZATION}/${REPO}/releases" \
              -f "tag_name=${NEW_TAG}" \
              -f "target_commitish=main" \
              -f "name=${RELEASE_VERSION}" \
              -f "body=${RELEASE_NOTES}" \
              -F draft=false \
              -F prerelease=false

            echo ""
            echo "✅ Release published successfully"
            echo "Repository : ${REPO}"
            echo "Old Tag    : ${OLD_TAG:-"(first release)"}"
            echo "New Tag    : ${NEW_TAG}"

          done

      # ---------------------------------------------------------
      # 6. Generate Job Summary
      # ---------------------------------------------------------
      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🚀 Release Creation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Version | \`${RELEASE_VERSION}\` |
          | Organization | \`${ORGANIZATION}\` |
          | Release Branch | \`${RELEASE_BRANCH}\` |
          | Target Branch | \`main\` |
          | Applications | \`${APPLICATIONS}\` |

          ## Actions Performed

          - ✅ Release branch identified
          - ✅ Release branch commit identified
          - ✅ Short commit ID generated
          - ✅ Release tag created
          - ✅ Previous tag identified
          - ✅ Release notes generated
          - ✅ GitHub Release published
          EOF
