name: Generate Release Notes

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        type: string

      applications:
        description: "Applications to release (comma-separated)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release-notes:
    name: Create and Publish Releases
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Read Release Information
      # =========================================================
      - name: Read Release Information
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
        run: |
          echo "========================================================"
          echo "              CREATE GITHUB RELEASES"
          echo "========================================================"
          echo ""
          echo "Release Version : ${RELEASE_VERSION}"
          echo "Applications     : ${APPLICATIONS}"
          echo ""

      # =========================================================
      # 2. Detect GitHub Organization
      # =========================================================
      - name: Detect GitHub Organization
        shell: bash
        run: |
          ORGANIZATION="${{ github.repository_owner }}"

          echo "Organization: ${ORGANIZATION}"

          echo "ORGANIZATION=${ORGANIZATION}" >> "$GITHUB_ENV"

      # =========================================================
      # 3. Validate PAT
      # =========================================================
      - name: Validate Release Automation Token
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "${RELEASE_AUTOMATION_TOKEN}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          echo "GitHub authentication token configured successfully."

      # =========================================================
      # 4. Generate Release Branch Name
      # =========================================================
      - name: Generate Release Branch Name
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          RELEASE_BRANCH="release/SG_RELEASE_${RELEASE_VERSION}"

          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"

          echo ""
          echo "Release Branch:"
          echo "${RELEASE_BRANCH}"
          echo ""

      # =========================================================
      # 5. Create GitHub Releases
      # =========================================================
      - name: Create GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |

          set -e

          IFS=',' read -ra APPS <<< "${APPLICATIONS}"

          declare -A RELEASE_RESULTS
          declare -A RELEASE_TAGS
          declare -A PREVIOUS_TAGS
          declare -A RELEASE_URLS

          TOTAL=0
          SUCCESS=0
          FAILED=0

          for REPO in "${APPS[@]}"; do

            REPO=$(echo "${REPO}" | xargs)

            if [[ -z "${REPO}" ]]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            echo ""
            echo "========================================================"
            echo "Processing Repository : ${REPO}"
            echo "Release Branch        : ${RELEASE_BRANCH}"
            echo "========================================================"
            echo ""

            # =====================================================
            # 5.1 Get Commit from Release Branch
            # =====================================================

            echo "Getting release branch commit..."

            if ! NEW_COMMIT=$(gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/heads/${RELEASE_BRANCH}" \
              --jq '.object.sha'); then

              echo "::error::Unable to find release branch ${RELEASE_BRANCH} in ${REPO}."

              RELEASE_RESULTS["${REPO}"]="failed"
              FAILED=$((FAILED + 1))

              continue
            fi

            SHORT_COMMIT="${NEW_COMMIT:0:7}"

            echo "Full Commit ID  : ${NEW_COMMIT}"
            echo "Short Commit ID : ${SHORT_COMMIT}"

            # =====================================================
            # 5.2 Create Release Tag
            # =====================================================

            NEW_TAG="${RELEASE_VERSION}-release-${SHORT_COMMIT}"

            echo ""
            echo "New Release Tag:"
            echo "${NEW_TAG}"
            echo ""

            if gh api \
              "repos/${ORGANIZATION}/${REPO}/git/ref/tags/${NEW_TAG}" \
              > /dev/null 2>&1; then

              echo "Tag already exists."

            else

              echo "Creating tag ${NEW_TAG}..."

              gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/git/refs" \
                -f "ref=refs/tags/${NEW_TAG}" \
                -f "sha=${NEW_COMMIT}"

              echo "✅ Tag created successfully."

            fi

            # =====================================================
            # 5.3 Find Previous Published Release
            # =====================================================

            echo ""
            echo "Finding previous published release..."

            OLD_TAG=""

            OLD_TAG=$(gh release list \
              --repo "${ORGANIZATION}/${REPO}" \
              --limit 20 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '.[].tagName' \
              | grep -v "^${NEW_TAG}$" \
              | head -n 1 || true)

            if [[ -n "${OLD_TAG}" ]]; then

              echo "Previous Release Tag:"
              echo "${OLD_TAG}"

            else

              echo "No previous published release found."

            fi

            # =====================================================
            # 5.4 Compare Previous Tag with New Tag
            # =====================================================

            echo ""
            echo "Comparing release tags..."

            if [[ -n "${OLD_TAG}" ]]; then

              COMPARE_DATA=$(gh api \
                "repos/${ORGANIZATION}/${REPO}/compare/${OLD_TAG}...${NEW_TAG}")

              COMMITS=$(echo "${COMPARE_DATA}" | jq -r '
                .commits[] |
                "- `" + (.sha[0:7]) + "` " + (.commit.message | split("\n")[0])
              ')

              CHANGED_FILES=$(echo "${COMPARE_DATA}" | jq -r '
                .files[] |
                "- `" + .filename + "` (" + .status + ")"
              ')

              TOTAL_COMMITS=$(echo "${COMPARE_DATA}" | jq '.commits | length')

              TOTAL_FILES=$(echo "${COMPARE_DATA}" | jq '.files | length')

              echo "Commits Changed : ${TOTAL_COMMITS}"
              echo "Files Changed   : ${TOTAL_FILES}"

            else

              COMMITS="No previous release available for comparison."
              CHANGED_FILES="No previous release available for comparison."

              TOTAL_COMMITS=0
              TOTAL_FILES=0

            fi

            # =====================================================
            # 5.5 Generate GitHub Automatic Release Notes
            # =====================================================

            echo ""
            echo "Generating GitHub release notes..."

            if [[ -n "${OLD_TAG}" ]]; then

              AUTO_NOTES=$(gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/releases/generate-notes" \
                -f "tag_name=${NEW_TAG}" \
                -f "previous_tag_name=${OLD_TAG}" \
                --jq '.body')

            else

              AUTO_NOTES=$(gh api \
                --method POST \
                "repos/${ORGANIZATION}/${REPO}/releases/generate-notes" \
                -f "tag_name=${NEW_TAG}" \
                --jq '.body')

            fi

            echo "✅ GitHub release notes generated."

            # =====================================================
            # 5.6 Build Complete Release Notes
            # =====================================================

            RELEASE_NOTES=$(cat <<EOF
${AUTO_NOTES}

---

## 📋 Release Comparison

| Field | Value |
|---|---|
| Previous Release | \`${OLD_TAG:-First Release}\` |
| New Release | \`${NEW_TAG}\` |
| Release Branch | \`${RELEASE_BRANCH}\` |
| Release Commit | \`${SHORT_COMMIT}\` |
| Commits Changed | ${TOTAL_COMMITS} |
| Files Changed | ${TOTAL_FILES} |

## 📝 Commits

${COMMITS}

## 📂 Changed Files

${CHANGED_FILES}

---

**Full Changelog:** ${OLD_TAG:+https://github.com/${ORGANIZATION}/${REPO}/compare/${OLD_TAG}...${NEW_TAG}}
EOF
)

            # =====================================================
            # 5.7 Create GitHub Release
            # =====================================================

            echo ""
            echo "Publishing GitHub Release..."

            RELEASE_RESPONSE=$(gh api \
              --method POST \
              "repos/${ORGANIZATION}/${REPO}/releases" \
              -f "tag_name=${NEW_TAG}" \
              -f "name=${RELEASE_VERSION}" \
              -f "body=${RELEASE_NOTES}" \
              -F draft=false \
              -F prerelease=false)

            RELEASE_URL=$(echo "${RELEASE_RESPONSE}" | jq -r '.html_url')

            echo ""
            echo "✅ Release published successfully"
            echo ""
            echo "Repository      : ${REPO}"
            echo "Previous Tag    : ${OLD_TAG:-"(first release)"}"
            echo "New Tag         : ${NEW_TAG}"
            echo "Release Commit  : ${SHORT_COMMIT}"
            echo "Release URL     : ${RELEASE_URL}"

            RELEASE_RESULTS["${REPO}"]="success"
            RELEASE_TAGS["${REPO}"]="${NEW_TAG}"
            PREVIOUS_TAGS["${REPO}"]="${OLD_TAG:-"(first release)"}"
            RELEASE_URLS["${REPO}"]="${RELEASE_URL}"

            SUCCESS=$((SUCCESS + 1))

          done

          # =======================================================
          # Store Results
          # =======================================================

          echo "RELEASE_RESULTS<<EOF" >> "$GITHUB_ENV"

          for REPO in "${!RELEASE_RESULTS[@]}"; do
            echo "${REPO}:${RELEASE_RESULTS[${REPO}]}" >> "$GITHUB_ENV"
          done

          echo "EOF" >> "$GITHUB_ENV"

          echo "RELEASE_TAGS<<EOF" >> "$GITHUB_ENV"

          for REPO in "${!RELEASE_TAGS[@]}"; do
            echo "${REPO}:${RELEASE_TAGS[${REPO}]}" >> "$GITHUB_ENV"
          done

          echo "EOF" >> "$GITHUB_ENV"

          echo "PREVIOUS_TAGS<<EOF" >> "$GITHUB_ENV"

          for REPO in "${!PREVIOUS_TAGS[@]}"; do
            echo "${REPO}:${PREVIOUS_TAGS[${REPO}]}" >> "$GITHUB_ENV"
          done

          echo "EOF" >> "$GITHUB_ENV"

          echo "RELEASE_URLS<<EOF" >> "$GITHUB_ENV"

          for REPO in "${!RELEASE_URLS[@]}"; do
            echo "${REPO}:${RELEASE_URLS[${REPO}]}" >> "$GITHUB_ENV"
          done

          echo "EOF" >> "$GITHUB_ENV"

          # =======================================================
          # Overall Result
          # =======================================================

          echo ""
          echo "========================================================"
          echo "                 RELEASE RESULT"
          echo "========================================================"
          echo ""
          echo "Total     : ${TOTAL}"
          echo "Successful: ${SUCCESS}"
          echo "Failed    : ${FAILED}"
          echo ""

          if [[ "${FAILED}" -gt 0 ]]; then
            echo "::error::One or more releases failed."
            exit 1
          fi

      # =========================================================
      # 6. Generate GitHub Actions Summary
      # =========================================================

      - name: Generate Release Summary
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          APPLICATIONS: ${{ inputs.applications }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
          RELEASE_RESULTS: ${{ env.RELEASE_RESULTS }}
          RELEASE_TAGS: ${{ env.RELEASE_TAGS }}
          PREVIOUS_TAGS: ${{ env.PREVIOUS_TAGS }}
          RELEASE_URLS: ${{ env.RELEASE_URLS }}
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          # 🚀 Release Creation

          ## Release Details

          | Field | Value |
          |---|---|
          | Release Version | \`${RELEASE_VERSION}\` |
          | Organization | \`${ORGANIZATION}\` |
          | Release Branch | \`${RELEASE_BRANCH}\` |
          | Applications | \`${APPLICATIONS}\` |

          ## Release Results

          | Repository | Previous Tag | New Tag | Status | Release |
          |---|---|---|---|---|
          EOF

          IFS=',' read -ra APPS <<< "${APPLICATIONS}"

          TOTAL=0
          SUCCESS=0
          FAILED=0

          for REPO in "${APPS[@]}"; do

            REPO=$(echo "${REPO}" | xargs)

            if [[ -z "${REPO}" ]]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            RESULT="failed"
            NEW_TAG=""
            OLD_TAG=""
            RELEASE_URL=""

            while IFS=: read -r repo status; do
              if [[ "$repo" == "$REPO" ]]; then
                RESULT="$status"
                break
              fi
            done <<< "${RELEASE_RESULTS}"

            while IFS=: read -r repo tag; do
              if [[ "$repo" == "$REPO" ]]; then
                NEW_TAG="$tag"
                break
              fi
            done <<< "${RELEASE_TAGS}"

            while IFS=: read -r repo tag; do
              if [[ "$repo" == "$REPO" ]]; then
                OLD_TAG="$tag"
                break
              fi
            done <<< "${PREVIOUS_TAGS}"

            while IFS=: read -r repo url; do
              if [[ "$repo" == "$REPO" ]]; then
                RELEASE_URL="$url"
                break
              fi
            done <<< "${RELEASE_URLS}"

            if [[ "$RESULT" == "success" ]]; then

              SUCCESS=$((SUCCESS + 1))

              echo "| \`${REPO}\` | \`${OLD_TAG}\` | \`${NEW_TAG}\` | ✅ Published | [Open Release](${RELEASE_URL}) |" \
                >> "$GITHUB_STEP_SUMMARY"

            else

              FAILED=$((FAILED + 1))

              echo "| \`${REPO}\` | — | — | ❌ Release Not Created | — |" \
                >> "$GITHUB_STEP_SUMMARY"

            fi

          done

          if [[ "${FAILED}" -eq 0 ]]; then
            OVERALL_STATUS="✅ All releases published successfully"
          else
            OVERALL_STATUS="❌ One or more releases failed"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## Overall Result

          ${OVERALL_STATUS}

          | Metric | Count |
          |---|---:|
          | Total Applications | ${TOTAL} |
          | Releases Published | ${SUCCESS} |
          | Releases Failed | ${FAILED} |

          ## Release Flow

          \`Release Branch\`
          ↓
          \`Get Release Branch Commit\`
          ↓
          \`Create Release Tag\`
          ↓
          \`Find Previous Release Tag\`
          ↓
          \`Compare Previous Tag → New Tag\`
          ↓
          \`Generate Release Notes\`
          ↓
          \`Publish GitHub Release\`

          EOF
