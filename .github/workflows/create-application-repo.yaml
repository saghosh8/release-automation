name: Create Application Repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name to create"
        required: true
        type: string

      description:
        description: "Repository description"
        required: false
        default: "Application repository"
        type: string

permissions:
  contents: read

jobs:
  create-repository:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout automation repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Validate helm_data.txt
      # --------------------------------------------------
      - name: Validate input file
        shell: bash
        run: |
          set -e

          FILE="input_files/helm_data.txt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          source "$FILE"

          required_values=(
            APP_NAME
            IMAGE_REPOSITORY
            IMAGE_TAG
            DEV_REPLICA_COUNT
            UAT_REPLICA_COUNT
            PROD_REPLICA_COUNT
            CONTAINER_PORT
            SERVICE_PORT
            SERVICE_TYPE
            INGRESS_ENABLED
            INGRESS_HOST
            HPA_ENABLED
            HPA_MIN_REPLICAS
            HPA_MAX_REPLICAS
            HPA_CPU_TARGET
          )

          for value in "${required_values[@]}"; do
            if [ -z "${!value}" ]; then
              echo "ERROR: Missing value: $value"
              exit 1
            fi
          done

          echo "Input validation successful."

      # --------------------------------------------------
      # Check repository
      # --------------------------------------------------
      - name: Check if repository exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -e

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${{ inputs.repo_name }}"

          echo "Checking ${OWNER}/${REPO}"

          if gh repo view "${OWNER}/${REPO}" >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Repository ${OWNER}/${REPO} already exists."
            echo "Failing workflow to prevent modification of existing repository."
            exit 1
          fi

          echo "Repository does not exist."

      # --------------------------------------------------
      # Create repository
      # --------------------------------------------------
      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -e

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${{ inputs.repo_name }}"
          DESCRIPTION="${{ inputs.description }}"

          gh repo create "${OWNER}/${REPO}" \
            --private \
            --description "${DESCRIPTION}"

          echo "Repository created."

      # --------------------------------------------------
      # Load input values
      # --------------------------------------------------
      - name: Load application configuration
        shell: bash
        run: |
          set -e

          source input_files/helm_data.txt

          cat >> "$GITHUB_ENV" <<EOF
          APP_NAME=${APP_NAME}
          IMAGE_REPOSITORY=${IMAGE_REPOSITORY}
          IMAGE_TAG=${IMAGE_TAG}
          DEV_REPLICA_COUNT=${DEV_REPLICA_COUNT}
          UAT_REPLICA_COUNT=${UAT_REPLICA_COUNT}
          PROD_REPLICA_COUNT=${PROD_REPLICA_COUNT}
          CONTAINER_PORT=${CONTAINER_PORT}
          SERVICE_PORT=${SERVICE_PORT}
          SERVICE_TYPE=${SERVICE_TYPE}
          INGRESS_ENABLED=${INGRESS_ENABLED}
          INGRESS_HOST=${INGRESS_HOST}
          HPA_ENABLED=${HPA_ENABLED}
          HPA_MIN_REPLICAS=${HPA_MIN_REPLICAS}
          HPA_MAX_REPLICAS=${HPA_MAX_REPLICAS}
          HPA_CPU_TARGET=${HPA_CPU_TARGET}
          EOF

      # --------------------------------------------------
      # Create Java application structure
      # --------------------------------------------------
      - name: Create application structure
        shell: bash
        run: |
          set -e

          PACKAGE_NAME=$(echo "${APP_NAME}" | tr '-' '.')

          CLASS_NAME=$(echo "${APP_NAME}" | sed \
            -E 's/(^|-)([a-z])/\U\2/g')

          mkdir -p \
            "src/main/java/com/example/${APP_NAME}/controller" \
            "src/main/resources" \
            "src/test/java/com/example/${APP_NAME}" \
            "config"

          # ----------------------------------------------
          # Application class
          # ----------------------------------------------
          cat > "src/main/java/com/example/${APP_NAME}/${CLASS_NAME}Application.java" <<EOF
          package com.example.${APP_NAME};

          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;

          @SpringBootApplication
          public class ${CLASS_NAME}Application {

              public static void main(String[] args) {
                  SpringApplication.run(${CLASS_NAME}Application.class, args);
              }
          }
          EOF

          # ----------------------------------------------
          # Health controller
          # ----------------------------------------------
          cat > "src/main/java/com/example/${APP_NAME}/controller/HealthController.java" <<EOF
          package com.example.${APP_NAME}.controller;

          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;

          @RestController
          public class HealthController {

              @GetMapping("/health")
              public String health() {
                  return "UP";
              }
          }
          EOF

          # ----------------------------------------------
          # application.yml
          # ----------------------------------------------
          cat > src/main/resources/application.yml <<EOF
          server:
            port: ${CONTAINER_PORT}

          spring:
            application:
              name: ${APP_NAME}
          EOF

          # ----------------------------------------------
          # Test
          # ----------------------------------------------
          cat > "src/test/java/com/example/${APP_NAME}/${CLASS_NAME}ApplicationTests.java" <<EOF
          package com.example.${APP_NAME};

          import org.junit.jupiter.api.Test;

          class ${CLASS_NAME}ApplicationTests {

              @Test
              void contextLoads() {
              }
          }
          EOF

      # --------------------------------------------------
      # Create Maven files
      # --------------------------------------------------
      - name: Create Maven configuration
        shell: bash
        run: |
          cat > pom.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.3.0</version>
                  <relativePath/>
              </parent>

              <groupId>com.example</groupId>
              <artifactId>${APP_NAME}</artifactId>
              <version>0.0.1-SNAPSHOT</version>

              <properties>
                  <java.version>17</java.version>
              </properties>

              <dependencies>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-web</artifactId>
                  </dependency>

                  <dependency>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-test</artifactId>
                      <scope>test</scope>
                  </dependency>

              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

      # --------------------------------------------------
      # Create config files
      # --------------------------------------------------
      - name: Create configuration files
        shell: bash
        run: |

          cat > config/application-config.yaml <<EOF
          application:
            name: ${APP_NAME}

          server:
            port: ${CONTAINER_PORT}
          EOF

          cat > config/release-config.json <<EOF
          {
            "application": "${APP_NAME}",
            "image": "${IMAGE_REPOSITORY}",
            "tag": "${IMAGE_TAG}"
          }
          EOF

          cat > config/services.json <<EOF
          {
            "application": "${APP_NAME}",
            "servicePort": ${SERVICE_PORT},
            "containerPort": ${CONTAINER_PORT},
            "serviceType": "${SERVICE_TYPE}"
          }
          EOF

      # --------------------------------------------------
      # Create Helm structure
      # --------------------------------------------------
      - name: Create Helm chart
        shell: bash
        run: |
          set -e

          HELM_DIR="helm/${APP_NAME}"

          mkdir -p "${HELM_DIR}/templates"

          # ----------------------------------------------
          # Chart.yaml
          # ----------------------------------------------
          cat > "${HELM_DIR}/Chart.yaml" <<EOF
          apiVersion: v2
          name: ${APP_NAME}
          description: Helm chart for ${APP_NAME}
          type: application
          version: 0.1.0
          appVersion: "${IMAGE_TAG}"
          EOF

          # ----------------------------------------------
          # .helmignore
          # ----------------------------------------------
          cat > "${HELM_DIR}/.helmignore" <<EOF
          .DS_Store
          .git/
          .gitignore
          README.md
          EOF

          # ----------------------------------------------
          # values.yaml
          # ----------------------------------------------
          cat > "${HELM_DIR}/values.yaml" <<EOF
          replicaCount: ${DEV_REPLICA_COUNT}

          image:
            repository: ${IMAGE_REPOSITORY}
            tag: "${IMAGE_TAG}"
            pullPolicy: IfNotPresent

          service:
            type: ${SERVICE_TYPE}
            port: ${SERVICE_PORT}

          containerPort: ${CONTAINER_PORT}

          ingress:
            enabled: ${INGRESS_ENABLED}
            host: ${INGRESS_HOST}

          hpa:
            enabled: ${HPA_ENABLED}
            minReplicas: ${HPA_MIN_REPLICAS}
            maxReplicas: ${HPA_MAX_REPLICAS}
            cpuTarget: ${HPA_CPU_TARGET}
          EOF

          # ----------------------------------------------
          # DEV
          # ----------------------------------------------
          cat > "${HELM_DIR}/values-dev.yaml" <<EOF
          replicaCount: ${DEV_REPLICA_COUNT}
          EOF

          # ----------------------------------------------
          # UAT
          # ----------------------------------------------
          cat > "${HELM_DIR}/values-uat.yaml" <<EOF
          replicaCount: ${UAT_REPLICA_COUNT}
          EOF

          # ----------------------------------------------
          # PROD
          # ----------------------------------------------
          cat > "${HELM_DIR}/values-prod.yaml" <<EOF
          replicaCount: ${PROD_REPLICA_COUNT}
          EOF

          # ----------------------------------------------
          # Helpers
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/_helpers.tpl" <<EOF
          {{- define "${APP_NAME}.name" -}}
          ${APP_NAME}
          {{- end }}

          {{- define "${APP_NAME}.fullname" -}}
          {{ .Release.Name }}-${APP_NAME}
          {{- end }}
          EOF

          # ----------------------------------------------
          # Deployment
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ include "APP_NAME_PLACEHOLDER.fullname" . }}
          spec:
            replicas: {{ .Values.replicaCount }}
            selector:
              matchLabels:
                app: {{ include "APP_NAME_PLACEHOLDER.name" . }}
            template:
              metadata:
                labels:
                  app: {{ include "APP_NAME_PLACEHOLDER.name" . }}
              spec:
                containers:
                  - name: APP_NAME_PLACEHOLDER
                    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                    imagePullPolicy: {{ .Values.image.pullPolicy }}
                    ports:
                      - containerPort: {{ .Values.containerPort }}
          EOF

          sed -i "s/APP_NAME_PLACEHOLDER/${APP_NAME}/g" \
            "${HELM_DIR}/templates/deployment.yaml"

          # ----------------------------------------------
          # Service
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/service.yaml" <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ include "APP_NAME_PLACEHOLDER.fullname" . }}
          spec:
            type: {{ .Values.service.type }}
            selector:
              app: {{ include "APP_NAME_PLACEHOLDER.name" . }}
            ports:
              - port: {{ .Values.service.port }}
                targetPort: {{ .Values.containerPort }}
          EOF

          sed -i "s/APP_NAME_PLACEHOLDER/${APP_NAME}/g" \
            "${HELM_DIR}/templates/service.yaml"

          # ----------------------------------------------
          # Ingress
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/ingress.yaml" <<'EOF'
          {{- if .Values.ingress.enabled }}
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: {{ include "APP_NAME_PLACEHOLDER.fullname" . }}
          spec:
            rules:
              - host: {{ .Values.ingress.host }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: {{ include "APP_NAME_PLACEHOLDER.fullname" . }}
                          port:
                            number: {{ .Values.service.port }}
          {{- end }}
          EOF

          sed -i "s/APP_NAME_PLACEHOLDER/${APP_NAME}/g" \
            "${HELM_DIR}/templates/ingress.yaml"

          # ----------------------------------------------
          # ConfigMap
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/configmap.yaml" <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${APP_NAME}-config
          data:
            APP_NAME: "${APP_NAME}"
          EOF

          # ----------------------------------------------
          # HPA
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/hpa.yaml" <<'EOF'
          {{- if .Values.hpa.enabled }}
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: APP_NAME_PLACEHOLDER
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: {{ include "APP_NAME_PLACEHOLDER.fullname" . }}
            minReplicas: {{ .Values.hpa.minReplicas }}
            maxReplicas: {{ .Values.hpa.maxReplicas }}
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: {{ .Values.hpa.cpuTarget }}
          {{- end }}
          EOF

          sed -i "s/APP_NAME_PLACEHOLDER/${APP_NAME}/g" \
            "${HELM_DIR}/templates/hpa.yaml"

          # ----------------------------------------------
          # NOTES
          # ----------------------------------------------
          cat > "${HELM_DIR}/templates/NOTES.txt" <<EOF
          ${APP_NAME} has been deployed.

          Application:
            ${APP_NAME}

          Image:
            ${IMAGE_REPOSITORY}:${IMAGE_TAG}
          EOF

      # --------------------------------------------------
      # README
      # --------------------------------------------------
      - name: Create README
        shell: bash
        run: |
          cat > README.md <<EOF
          # ${APP_NAME}

          Application repository generated automatically.

          ## Structure

          - src/       - Spring Boot application
          - config/    - Application configuration
          - helm/      - Helm deployment configuration
          - pom.xml    - Maven configuration
          EOF

      # --------------------------------------------------
      # Gitignore
      # --------------------------------------------------
      - name: Create gitignore
        shell: bash
        run: |
          cat > .gitignore <<EOF
          target/
          .idea/
          *.iml
          .DS_Store
          EOF

      # --------------------------------------------------
      # Push everything
      # --------------------------------------------------
      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -e

          git init
          git checkout -b main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Initial application structure"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${{ inputs.repo_name }}.git"

          git push -u origin main

          echo "Application repository created successfully."
