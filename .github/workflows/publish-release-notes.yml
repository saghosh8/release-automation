name: Create and Publish Release Notes

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch name, e.g. SG_RELEASE_1.0.0"
        required: true
        type: string

      repositories:
        description: "Application repository name(s), comma-separated"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-and-publish-release:
    name: Create and Publish Release
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Validate inputs
      # ==========================================================
      - name: Validate input
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_INPUT="${{ inputs.release_branch }}"
          REPOSITORIES="${{ inputs.repositories }}"

          echo "Release input: $RELEASE_INPUT"
          echo "Repositories : $REPOSITORIES"

          if [[ -z "$RELEASE_INPUT" ]]; then
            echo "::error::Release branch input cannot be empty."
            exit 1
          fi

          if [[ -z "$REPOSITORIES" ]]; then
            echo "::error::Repository input cannot be empty."
            exit 1
          fi

          if [[ ! "$RELEASE_INPUT" =~ ^SG_RELEASE_[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release branch format."
            echo "::error::Expected format: SG_RELEASE_X.Y.Z"
            exit 1
          fi

          VERSION="${RELEASE_INPUT#SG_RELEASE_}"
          RELEASE_BRANCH="release/${RELEASE_INPUT}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> "$GITHUB_ENV"

          echo ""
          echo "Version        : $VERSION"
          echo "Release branch : $RELEASE_BRANCH"


      # ==========================================================
      # 2. Process repositories
      # ==========================================================
      - name: Process repositories
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORIES: ${{ inputs.repositories }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

          IFS=',' read -ra REPO_ARRAY <<< "$REPOSITORIES"

          for REPO in "${REPO_ARRAY[@]}"; do

            REPO="$(echo "$REPO" | xargs)"

            if [[ -z "$REPO" ]]; then
              echo "::error::Repository name cannot be empty."
              exit 1
            fi

            echo ""
            echo "############################################################"
            echo "Processing repository: $REPO"
            echo "Release branch       : $RELEASE_BRANCH"
            echo "Version              : $VERSION"
            echo "############################################################"


            # ====================================================
            # 3. Resolve repository
            # ====================================================
            echo ""
            echo "Resolving repository..."

            REPO_FULL_NAME=$(gh repo view "$REPO" \
              --json nameWithOwner \
              --jq '.nameWithOwner') || {
                echo "::error::Repository does not exist or token has no access."
                echo "::error::Repository: $REPO"
                exit 1
              }

            if [[ -z "$REPO_FULL_NAME" || "$REPO_FULL_NAME" == "null" ]]; then
              echo "::error::Could not resolve repository."
              exit 1
            fi

            echo "Repository: $REPO_FULL_NAME"


            # ====================================================
            # 4. Build authenticated repository URL
            # ====================================================
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL_NAME}.git"

            echo ""
            echo "Repository URL resolved successfully."


            # ====================================================
            # 5. Check release branch
            # ====================================================
            echo ""
            echo "Checking release branch..."
            echo "Branch: $RELEASE_BRANCH"

            BRANCH_RESULT=$(git ls-remote \
              "$REPO_URL" \
              "refs/heads/${RELEASE_BRANCH}") || {
                echo "::error::Unable to access repository."
                echo "::error::Repository: $REPO_FULL_NAME"
                exit 1
              }

            if [[ -z "$BRANCH_RESULT" ]]; then
              echo "::error::Release branch does not exist."
              echo "::error::Repository: $REPO_FULL_NAME"
              echo "::error::Branch: $RELEASE_BRANCH"
              exit 1
            fi

            BRANCH_SHA=$(echo "$BRANCH_RESULT" | awk '{print $1}')

            if [[ ! "$BRANCH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid commit SHA returned for release branch."
              echo "::error::Value: $BRANCH_SHA"
              exit 1
            fi

            SHORT_COMMIT_SHA=$(echo "$BRANCH_SHA" | cut -c1-7)

            echo "Release branch exists."
            echo "Full commit SHA : $BRANCH_SHA"
            echo "Short commit SHA: $SHORT_COMMIT_SHA"


            # ====================================================
            # 6. Create release tag name
            #
            # Example:
            # 1.0.0-release-81269a6
            # ====================================================
            NEW_TAG="${VERSION}-release-${SHORT_COMMIT_SHA}"

            echo ""
            echo "Release tag: $NEW_TAG"


            # ====================================================
            # 7. Check whether tag exists
            #
            # IMPORTANT:
            # git ls-remote returns EMPTY when tag doesn't exist.
            # It does NOT return GitHub API error JSON.
            # ====================================================
            echo ""
            echo "Checking whether release tag already exists..."

            TAG_RESULT=$(git ls-remote \
              "$REPO_URL" \
              "refs/tags/${NEW_TAG}") || {
                echo "::error::Unable to query repository tags."
                echo "::error::Repository: $REPO_FULL_NAME"
                exit 1
              }

            if [[ -n "$TAG_RESULT" ]]; then

              EXISTING_TAG_SHA=$(echo "$TAG_RESULT" | awk '{print $1}')

              echo "Tag already exists."
              echo "Tag     : $NEW_TAG"
              echo "Tag SHA : $EXISTING_TAG_SHA"

              if [[ "$EXISTING_TAG_SHA" != "$BRANCH_SHA" ]]; then
                echo "::error::Tag already exists but points to a different commit."
                echo "::error::Expected: $BRANCH_SHA"
                echo "::error::Actual  : $EXISTING_TAG_SHA"
                exit 1
              fi

              echo "Existing tag points to the correct commit."

            else

              echo "Tag does not exist."
              echo "Creating tag: $NEW_TAG"


              # ==================================================
              # 8. Create tag
              # ==================================================
              gh api \
                --method POST \
                "/repos/${REPO_FULL_NAME}/git/refs" \
                -f "ref=refs/tags/${NEW_TAG}" \
                -f "sha=${BRANCH_SHA}"

              echo "Tag creation request completed."


              # ==================================================
              # 9. Verify tag was created
              # ==================================================
              echo ""
              echo "Verifying tag creation..."

              TAG_RESULT=$(git ls-remote \
                "$REPO_URL" \
                "refs/tags/${NEW_TAG}") || {
                  echo "::error::Unable to verify newly created tag."
                  exit 1
                }

              if [[ -z "$TAG_RESULT" ]]; then
                echo "::error::Tag was not found after creation."
                echo "::error::Tag: $NEW_TAG"
                exit 1
              fi

              EXISTING_TAG_SHA=$(echo "$TAG_RESULT" | awk '{print $1}')

              if [[ "$EXISTING_TAG_SHA" != "$BRANCH_SHA" ]]; then
                echo "::error::Created tag points to the wrong commit."
                echo "::error::Expected: $BRANCH_SHA"
                echo "::error::Actual  : $EXISTING_TAG_SHA"
                exit 1
              fi

              echo "Tag successfully created and verified."
              echo "Tag SHA: $EXISTING_TAG_SHA"

            fi


            # ====================================================
            # 10. Get main branch
            # ====================================================
            echo ""
            echo "Checking main branch..."

            MAIN_RESULT=$(git ls-remote \
              "$REPO_URL" \
              "refs/heads/main") || {
                echo "::error::Unable to access main branch."
                echo "::error::Repository: $REPO_FULL_NAME"
                exit 1
              }

            if [[ -z "$MAIN_RESULT" ]]; then
              echo "::error::main branch does not exist."
              echo "::error::Repository: $REPO_FULL_NAME"
              exit 1
            fi

            MAIN_SHA=$(echo "$MAIN_RESULT" | awk '{print $1}')

            if [[ ! "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid main branch SHA."
              exit 1
            fi

            echo "main SHA: $MAIN_SHA"


            # ====================================================
            # 11. Find previous release tag
            # ====================================================
            echo ""
            echo "Finding previous release tag from main..."

            ALL_TAGS=$(gh api \
              --paginate \
              "/repos/${REPO_FULL_NAME}/tags" \
              --jq '.[].name') || {
                echo "::error::Unable to retrieve repository tags."
                exit 1
              }

            PREVIOUS_TAG=""

            while IFS= read -r TAG; do

              if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-release-[0-9a-fA-F]+$ ]]; then
                continue
              fi

              if [[ "$TAG" == "$NEW_TAG" ]]; then
                continue
              fi

              echo "Checking previous release candidate: $TAG"

              COMPARE_STATUS=$(gh api \
                "/repos/${REPO_FULL_NAME}/compare/${TAG}...main" \
                --jq '.status') || {
                  echo "::error::Unable to compare tag $TAG with main."
                  exit 1
                }

              if [[ "$COMPARE_STATUS" != "ahead" && "$COMPARE_STATUS" != "identical" ]]; then
                continue
              fi

              if [[ -z "$PREVIOUS_TAG" ]]; then

                PREVIOUS_TAG="$TAG"

              else

                CURRENT_VERSION="${TAG%%-release-*}"
                EXISTING_VERSION="${PREVIOUS_TAG%%-release-*}"

                HIGHEST_VERSION=$(
                  printf '%s\n%s\n' \
                    "$CURRENT_VERSION" \
                    "$EXISTING_VERSION" |
                  sort -V |
                  tail -n 1
                )

                if [[ "$HIGHEST_VERSION" == "$CURRENT_VERSION" ]]; then
                  PREVIOUS_TAG="$TAG"
                fi

              fi

            done <<< "$ALL_TAGS"


            # ====================================================
            # 12. Validate previous release
            # ====================================================
            if [[ -z "$PREVIOUS_TAG" ]]; then
              echo "::error::No previous release tag found on main."
              echo "::error::Repository: $REPO_FULL_NAME"
              exit 1
            fi

            echo ""
            echo "Previous release tag: $PREVIOUS_TAG"


            # ====================================================
            # 13. Compare releases
            # ====================================================
            echo ""
            echo "Comparing releases..."
            echo "Previous: $PREVIOUS_TAG"
            echo "Current : $NEW_TAG"

            COMPARISON=$(gh api \
              "/repos/${REPO_FULL_NAME}/compare/${PREVIOUS_TAG}...${NEW_TAG}") || {
                echo "::error::Unable to compare releases."
                exit 1
              }

            COMMIT_COUNT=$(echo "$COMPARISON" | jq -r '.ahead_by')

            if [[ -z "$COMMIT_COUNT" || "$COMMIT_COUNT" == "null" ]]; then
              echo "::error::Could not determine commit count."
              exit 1
            fi

            echo "Commits between releases: $COMMIT_COUNT"

            if [[ "$COMMIT_COUNT" -eq 0 ]]; then
              echo "::error::No commits found between releases."
              exit 1
            fi


            # ====================================================
            # 14. Check whether GitHub Release exists
            # ====================================================
            echo ""
            echo "Checking GitHub Release..."

            EXISTING_RELEASE=$(gh release view "$NEW_TAG" \
              --repo "$REPO_FULL_NAME" \
              --json tagName \
              --jq '.tagName' 2>/dev/null || true)

            if [[ "$EXISTING_RELEASE" == "$NEW_TAG" ]]; then
              echo "::error::GitHub Release already exists."
              echo "::error::Release: $NEW_TAG"
              exit 1
            fi


            # ====================================================
            # 15. Generate and publish release notes
            # ====================================================
            echo ""
            echo "Generating release notes..."
            echo "Publishing GitHub Release..."

            gh release create "$NEW_TAG" \
              --repo "$REPO_FULL_NAME" \
              --target "$BRANCH_SHA" \
              --title "$NEW_TAG" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG" \
              --verify-tag


            # ====================================================
            # 16. Verify release
            # ====================================================
            echo ""
            echo "Verifying GitHub Release..."

            RELEASE_TAG=$(gh release view "$NEW_TAG" \
              --repo "$REPO_FULL_NAME" \
              --json tagName \
              --jq '.tagName') || {
                echo "::error::Unable to verify GitHub Release."
                exit 1
              }

            if [[ "$RELEASE_TAG" != "$NEW_TAG" ]]; then
              echo "::error::GitHub Release verification failed."
              echo "::error::Expected: $NEW_TAG"
              echo "::error::Actual: $RELEASE_TAG"
              exit 1
            fi


            # ====================================================
            # 17. Success
            # ====================================================
            echo ""
            echo "############################################################"
            echo "RELEASE SUCCESSFUL"
            echo "############################################################"
            echo "Repository       : $REPO_FULL_NAME"
            echo "Release branch   : $RELEASE_BRANCH"
            echo "Version           : $VERSION"
            echo "Commit SHA        : $BRANCH_SHA"
            echo "Short commit SHA  : $SHORT_COMMIT_SHA"
            echo "Previous tag      : $PREVIOUS_TAG"
            echo "New tag            : $NEW_TAG"
            echo "Release notes      : Published"
            echo "############################################################"

          done
