name: Create and Publish Release Notes

on:
  workflow_call:
    inputs:
      release_branch:
        description: "Release branch name without the release/ prefix, e.g. SG_RELEASE_1.0.0"
        required: true
        type: string

      repositories:
        description: "Comma-separated repository names, e.g. repo-one,repo-two"
        required: true
        type: string

    secrets:
      RELEASE_AUTOMATION_TOKEN:
        description: "Token used for repository, branch, tag and release operations"
        required: true

jobs:
  create-and-publish:
    name: Create and Publish Release Notes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        repository: ${{ fromJSON(format('["{0}"]', join(fromJSON(format('["{0}"]', inputs.repositories)), '","'))) }}

    steps:

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_BRANCH="${{ inputs.release_branch }}"

          if [[ -z "$RELEASE_BRANCH" ]]; then
            echo "ERROR: release_branch cannot be empty."
            exit 1
          fi

          if [[ "$RELEASE_BRANCH" == release/* ]]; then
            echo "ERROR: release_branch should not contain the 'release/' prefix."
            echo "Example: SG_RELEASE_1.0.0"
            exit 1
          fi

          if [[ ! "$RELEASE_BRANCH" =~ ^SG_RELEASE_[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release branch format: $RELEASE_BRANCH"
            echo "Expected format: SG_RELEASE_X.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          fetch-depth: 0

      - name: Validate repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating repository: $REPOSITORY"

          if ! gh repo view "$REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: Repository does not exist or token has no access:"
            echo "$REPOSITORY"
            exit 1
          fi

      - name: Validate source release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source release branch: $RELEASE_BRANCH"

          if ! git ls-remote \
            --exit-code \
            --heads \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "$RELEASE_BRANCH" >/dev/null 2>&1; then

            echo "ERROR: Source release branch does not exist:"
            echo "$RELEASE_BRANCH"
            exit 1
          fi

          echo "Source release branch exists."

      - name: Prepare release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          SOURCE_BRANCH: ${{ inputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="release/${SOURCE_BRANCH}"

          echo "Source branch : $SOURCE_BRANCH"
          echo "Target branch : $TARGET_BRANCH"

          git fetch origin \
            "$SOURCE_BRANCH" \
            "main"

          SOURCE_SHA=$(git rev-parse "origin/${SOURCE_BRANCH}")

          echo "Source SHA: $SOURCE_SHA"

          if git ls-remote \
            --exit-code \
            --heads \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "$TARGET_BRANCH" >/dev/null 2>&1; then

            echo "Target branch already exists."

            TARGET_SHA=$(git ls-remote \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
              "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')

            if [[ "$TARGET_SHA" != "$SOURCE_SHA" ]]; then
              echo "ERROR: Target branch already exists but does not point to source release branch."
              echo "Source SHA : $SOURCE_SHA"
              echo "Target SHA : $TARGET_SHA"
              exit 1
            fi

          else
            echo "Creating target branch: $TARGET_BRANCH"

            git push origin \
              "origin/${SOURCE_BRANCH}:refs/heads/${TARGET_BRANCH}"
          fi

          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Get release version
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail

          VERSION="${SOURCE_BRANCH#SG_RELEASE_}"

          if [[ "$VERSION" == "$SOURCE_BRANCH" ]]; then
            echo "ERROR: Could not extract version from $SOURCE_BRANCH"
            exit 1
          fi

          echo "Release version: $VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Get new commit SHA
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"

          NEW_COMMIT_SHA=$(git rev-parse "origin/${TARGET_BRANCH}")
          SHORT_COMMIT_SHA=$(git rev-parse --short "$NEW_COMMIT_SHA")

          echo "New commit SHA       : $NEW_COMMIT_SHA"
          echo "New short commit SHA : $SHORT_COMMIT_SHA"

          echo "NEW_COMMIT_SHA=$NEW_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT_SHA=$SHORT_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Create release tag
        env:
          VERSION: ${{ env.VERSION }}
          SHORT_COMMIT_SHA: ${{ env.SHORT_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail

          NEW_TAG="${VERSION}-release-${SHORT_COMMIT_SHA}"

          echo "New tag: $NEW_TAG"

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then

            echo "ERROR: Tag already exists: $NEW_TAG"
            exit 1
          fi

          git tag "$NEW_TAG" "$NEW_COMMIT_SHA"
          git push origin "$NEW_TAG"

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - name: Find previous release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin

          PREVIOUS_TAG=$(
            git tag --merged origin/main \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-release-[0-9a-f]+$' \
              | grep -v "^${NEW_TAG}$" \
              | sort -V \
              | tail -n 1 || true
          )

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "ERROR: No previous release tag was found on main."
            exit 1
          fi

          echo "Previous release tag: $PREVIOUS_TAG"

          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: Validate previous release tag
        shell: bash
        run: |
          set -euo pipefail

          if ! git rev-parse "$PREVIOUS_TAG^{commit}" >/dev/null 2>&1; then
            echo "ERROR: Previous release tag does not resolve to a commit:"
            echo "$PREVIOUS_TAG"
            exit 1
          fi

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating release notes..."
          echo "Previous tag: $PREVIOUS_TAG"
          echo "New tag     : $NEW_TAG"

          git log \
            --pretty=format:'- %s (%h)' \
            "${PREVIOUS_TAG}..${NEW_TAG}" \
            > release_notes.txt

          if [[ ! -s release_notes.txt ]]; then
            echo "ERROR: No commits found between release tags."
            exit 1
          fi

          {
            echo "## What's Changed"
            echo
            cat release_notes.txt
            echo
            echo "**Previous Release:** \`$PREVIOUS_TAG\`"
            echo
            echo "**Current Release:** \`$NEW_TAG\`"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Validate generated release notes
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "ERROR: Release notes were not generated."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Publishing GitHub Release..."
          echo "Repository: $REPOSITORY"
          echo "Tag       : $NEW_TAG"

          gh release create "$NEW_TAG" \
            --repo "$REPOSITORY" \
            --title "$VERSION Release" \
            --notes-file RELEASE_NOTES.md \
            --target "$NEW_COMMIT_SHA"

          echo "Release published successfully."
