name: Create Application Repositories

on:
  workflow_dispatch:
    inputs:
      repo_names:
        description: "Repository names separated by comma"
        required: true
        type: string

      description:
        description: "Repository description"
        required: false
        default: "Application repository"
        type: string

permissions:
  contents: read

jobs:
  create-repositories:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout automation repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Install PyYAML
      # --------------------------------------------------
      - name: Install PyYAML
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install PyYAML

      # --------------------------------------------------
      # Validate input file
      # --------------------------------------------------
      - name: Validate input file
        shell: bash
        run: |
          set -e

          if [ ! -f "input_files/app_config.yaml" ]; then
            echo "ERROR: input_files/app_config.yaml not found"
            exit 1
          fi

          echo "Input file found."

      # --------------------------------------------------
      # Validate app_config.yaml
      # --------------------------------------------------
      - name: Validate application configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import sys

          file = "input_files/app_config.yaml"

          with open(file, "r") as f:
              config = yaml.safe_load(f)

          # --------------------------------------------------
          # Make sure app_config.yaml contains a YAML mapping
          # --------------------------------------------------
          if not isinstance(config, dict):
              print("ERROR: app_config.yaml must contain key/value pairs.")
              print("Expected format:")
              print("values:")
              print("  APP_NAME: my-app")
              print("  IMAGE_REPOSITORY: my-image")
              print("  IMAGE_TAG: latest")
              print("files:")
              print("  - path: \"...\"")
              print("    content: |")
              print("      ...")
              sys.exit(1)

          if "values" not in config or not isinstance(config["values"], dict):
              print("ERROR: app_config.yaml must contain a 'values' mapping.")
              sys.exit(1)

          if "files" not in config or not isinstance(config["files"], list):
              print("ERROR: app_config.yaml must contain a 'files' list.")
              sys.exit(1)

          data = config["values"]

          # NOTE: APP_NAME is intentionally not required here.
          # It is injected per-repository from the "repo_names" input
          # at generation time (see the "Create repositories" step).
          required = [
              "IMAGE_REPOSITORY",
              "IMAGE_TAG",
              "DEV_REPLICA_COUNT",
              "UAT_REPLICA_COUNT",
              "PROD_REPLICA_COUNT",
              "CONTAINER_PORT",
              "SERVICE_PORT",
              "SERVICE_TYPE",
              "INGRESS_ENABLED",
              "INGRESS_HOST",
              "HPA_ENABLED",
              "HPA_MIN_REPLICAS",
              "HPA_MAX_REPLICAS",
              "HPA_CPU_TARGET"
          ]

          missing = []

          for key in required:
              if key not in data:
                  missing.append(key)
              elif data[key] is None:
                  missing.append(key)
              elif str(data[key]).strip() == "":
                  missing.append(key)

          if missing:
              print("ERROR: Missing values:")

              for key in missing:
                  print(f"  - {key}")

              sys.exit(1)

          print("app_config.yaml validation successful.")
          PY

      # --------------------------------------------------
      # Validate repository names
      # --------------------------------------------------
      - name: Validate repository names
        shell: bash
        run: |
          set -e

          IFS=',' read -ra REPOS <<< "${{ inputs.repo_names }}"

          if [ "${#REPOS[@]}" -eq 0 ]; then
            echo "ERROR: No repository names provided."
            exit 1
          fi

          for repo in "${REPOS[@]}"; do

            repo=$(echo "$repo" | xargs)

            if [ -z "$repo" ]; then
              echo "ERROR: Empty repository name found."
              exit 1
            fi

            if [[ ! "$repo" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "ERROR: Invalid repository name: $repo"
              echo "Allowed characters: letters, numbers, -, _, ."
              exit 1
            fi

            echo "Valid repository: $repo"

          done

      # --------------------------------------------------
      # Preserve input files outside the per-repo working
      # directory. The loop below wipes the working directory
      # for every repository it creates, so input_files must
      # live somewhere that survives across iterations.
      # --------------------------------------------------
      - name: Stage input files
        shell: bash
        run: |
          set -e
          cp -r input_files "${RUNNER_TEMP}/input_files"
          echo "Staged config at ${RUNNER_TEMP}/input_files"

      # --------------------------------------------------
      # Create repositories
      # --------------------------------------------------
      - name: Create repositories
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -e

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: RELEASE_AUTOMATION_TOKEN secret is not configured."
            exit 1
          fi

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          CONFIG_FILE="${RUNNER_TEMP}/input_files/app_config.yaml"

          IFS=',' read -ra REPOS <<< "${{ inputs.repo_names }}"

          for repo in "${REPOS[@]}"; do

            repo=$(echo "$repo" | xargs)

            echo ""
            echo "=============================================="
            echo "Creating repository: ${OWNER}/${repo}"
            echo "=============================================="

            # --------------------------------------------------
            # Check repository
            # --------------------------------------------------
            if gh repo view "${OWNER}/${repo}" >/dev/null 2>&1; then
              echo ""
              echo "ERROR: Repository ${OWNER}/${repo} already exists."
              echo "Workflow stopped to prevent modification."
              exit 1
            fi

            echo "Repository does not exist."

            # --------------------------------------------------
            # Create repository
            # --------------------------------------------------
            gh repo create "${OWNER}/${repo}" \
              --private \
              --description "${{ inputs.description }}"

            echo "Repository created."

            # --------------------------------------------------
            # Clean workspace (nothing needs to survive in-place
            # anymore — input_files lives in RUNNER_TEMP now)
            # --------------------------------------------------
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            # --------------------------------------------------
            # Generate files from app_config.yaml
            # (REPO_NAME/CONFIG_FILE are exported so python can
            #  read them via os.environ)
            # --------------------------------------------------
            export REPO_NAME="${repo}"
            export CONFIG_FILE="${CONFIG_FILE}"

            python3 - <<'PY'
          import os
          import yaml
          import re

          config_file = os.environ["CONFIG_FILE"]

          with open(config_file, "r") as f:
              config = yaml.safe_load(f)

          # --------------------------------------------------
          # Validate structure
          # --------------------------------------------------
          if not isinstance(config, dict):
              raise Exception(
                  "app_config.yaml must contain a YAML mapping."
              )

          if "values" not in config or not isinstance(config["values"], dict):
              raise Exception(
                  "app_config.yaml must contain a 'values' mapping."
              )

          if "files" not in config or not isinstance(config["files"], list):
              raise Exception(
                  "app_config.yaml must contain a 'files' list."
              )

          values = config["values"]
          files = config["files"]

          # --------------------------------------------------
          # APP_NAME comes from the repository name passed in the
          # "repo_names" workflow input, NOT from app_config.yaml.
          # This guarantees each generated repo gets its own
          # correctly-named app, package, and Helm chart.
          # --------------------------------------------------
          values["APP_NAME"] = os.environ["REPO_NAME"]

          # --------------------------------------------------
          # Derive Java-safe package/class names from APP_NAME,
          # since Java identifiers cannot contain hyphens.
          # e.g. APP_NAME "application-three" ->
          #   JAVA_CLASS_NAME   = ApplicationThreeApplication
          #   JAVA_PACKAGE      = com.example.applicationthree
          #   JAVA_PACKAGE_PATH = com/example/applicationthree
          # --------------------------------------------------
          app_name = str(values["APP_NAME"])
          parts = [p for p in re.split(r"[-_]", app_name) if p]

          values["JAVA_CLASS_NAME"] = "".join(p.capitalize() for p in parts) + "Application"
          values["JAVA_PACKAGE"] = "com.example." + "".join(p.lower() for p in parts)
          values["JAVA_PACKAGE_PATH"] = "com/example/" + "".join(p.lower() for p in parts)

          # --------------------------------------------------
          # Replace variables
          # --------------------------------------------------
          def replace_variables(value):

              if not isinstance(value, str):
                  return value

              pattern = re.compile(
                  r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}"
              )

              def replace(match):

                  key = match.group(1)

                  if key not in values:
                      raise Exception(
                          f"Variable '{key}' is not defined in app_config.yaml values"
                      )

                  return str(values[key])

              return pattern.sub(replace, value)

          # --------------------------------------------------
          # Generate files
          # --------------------------------------------------
          for item in files:

              if not isinstance(item, dict):
                  raise Exception(
                      "Every item in 'files' must be a YAML mapping."
                  )

              if "path" not in item:
                  raise Exception(
                      "Every template file must have a 'path'"
                  )

              if "content" not in item:
                  raise Exception(
                      f"Missing content for file: {item['path']}"
                  )

              path = replace_variables(item["path"])
              content = replace_variables(item["content"])

              # --------------------------------------------------
              # Prevent accidental absolute paths
              # --------------------------------------------------
              if os.path.isabs(path):
                  raise Exception(
                      f"Absolute paths are not allowed: {path}"
                  )

              # --------------------------------------------------
              # Prevent path traversal
              # --------------------------------------------------
              normalized = os.path.normpath(path)

              if normalized.startswith("../") or normalized == "..":
                  raise Exception(
                      f"Path traversal is not allowed: {path}"
                  )

              # --------------------------------------------------
              # Create directory
              # --------------------------------------------------
              os.makedirs(
                  os.path.dirname(path) or ".",
                  exist_ok=True
              )

              # --------------------------------------------------
              # Write file
              # --------------------------------------------------
              with open(path, "w") as f:
                  f.write(content)

              print(f"Created: {path}")

          PY

            # --------------------------------------------------
            # Initialize new Git repository
            # --------------------------------------------------
            git init
            git branch -M main

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # --------------------------------------------------
            # Add generated files
            # --------------------------------------------------
            git add .

            echo ""
            echo "Files to be committed:"
            git status --short
            echo ""

            # --------------------------------------------------
            # Commit
            # --------------------------------------------------
            git commit -m "Initial application structure"

            # --------------------------------------------------
            # Add new repository as origin
            # --------------------------------------------------
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git"

            # --------------------------------------------------
            # Push
            # --------------------------------------------------
            git push -u origin main

            echo ""
            echo "Successfully created and pushed:"
            echo "${OWNER}/${repo}"
            echo ""

          done

          echo "=============================================="
          echo "All repositories created successfully."
          echo "=============================================="
