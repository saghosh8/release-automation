name: Create Application Repositories

on:
  workflow_dispatch:
    inputs:
      repo_names:
        description: "Repository names separated by comma"
        required: true
        type: string

      description:
        description: "Repository description"
        required: false
        default: "Application repository"
        type: string

permissions:
  contents: read

jobs:
  create-repositories:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout automation repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Install PyYAML
      # --------------------------------------------------
      - name: Install PyYAML
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install PyYAML

      # --------------------------------------------------
      # Validate input files
      # --------------------------------------------------
      - name: Validate input files
        shell: bash
        run: |
          set -e

          if [ ! -f "input_files/helm_data.yaml" ]; then
            echo "ERROR: input_files/helm_data.yaml not found"
            exit 1
          fi

          if [ ! -f "input_files/application_template.yaml" ]; then
            echo "ERROR: input_files/application_template.yaml not found"
            exit 1
          fi

          echo "Input files found."

      # --------------------------------------------------
      # Validate helm_data.yaml
      # --------------------------------------------------
      - name: Validate application configuration
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import sys

          file = "input_files/helm_data.yaml"

          with open(file, "r") as f:
              data = yaml.safe_load(f)

          # --------------------------------------------------
          # Make sure helm_data.yaml contains a YAML mapping
          # --------------------------------------------------
          if not isinstance(data, dict):
              print("ERROR: helm_data.yaml must contain key/value pairs.")
              print("Expected format:")
              print("APP_NAME: my-app")
              print("IMAGE_REPOSITORY: my-image")
              print("IMAGE_TAG: latest")
              sys.exit(1)

          required = [
              "APP_NAME",
              "IMAGE_REPOSITORY",
              "IMAGE_TAG",
              "DEV_REPLICA_COUNT",
              "UAT_REPLICA_COUNT",
              "PROD_REPLICA_COUNT",
              "CONTAINER_PORT",
              "SERVICE_PORT",
              "SERVICE_TYPE",
              "INGRESS_ENABLED",
              "INGRESS_HOST",
              "HPA_ENABLED",
              "HPA_MIN_REPLICAS",
              "HPA_MAX_REPLICAS",
              "HPA_CPU_TARGET"
          ]

          missing = []

          for key in required:
              if key not in data:
                  missing.append(key)
              elif data[key] is None:
                  missing.append(key)
              elif str(data[key]).strip() == "":
                  missing.append(key)

          if missing:
              print("ERROR: Missing values:")

              for key in missing:
                  print(f"  - {key}")

              sys.exit(1)

          print("helm_data.yaml validation successful.")
          PY

      # --------------------------------------------------
      # Validate repository names
      # --------------------------------------------------
      - name: Validate repository names
        shell: bash
        run: |
          set -e

          IFS=',' read -ra REPOS <<< "${{ inputs.repo_names }}"

          if [ "${#REPOS[@]}" -eq 0 ]; then
            echo "ERROR: No repository names provided."
            exit 1
          fi

          for repo in "${REPOS[@]}"; do

            repo=$(echo "$repo" | xargs)

            if [ -z "$repo" ]; then
              echo "ERROR: Empty repository name found."
              exit 1
            fi

            if [[ ! "$repo" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "ERROR: Invalid repository name: $repo"
              echo "Allowed characters: letters, numbers, -, _, ."
              exit 1
            fi

            echo "Valid repository: $repo"

          done

      # --------------------------------------------------
      # Create repositories
      # --------------------------------------------------
      - name: Create repositories
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -e

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: RELEASE_AUTOMATION_TOKEN secret is not configured."
            exit 1
          fi

          OWNER="${GITHUB_REPOSITORY_OWNER}"

          IFS=',' read -ra REPOS <<< "${{ inputs.repo_names }}"

          for repo in "${REPOS[@]}"; do

            repo=$(echo "$repo" | xargs)

            echo ""
            echo "=============================================="
            echo "Creating repository: ${OWNER}/${repo}"
            echo "=============================================="

            # --------------------------------------------------
            # Check repository
            # --------------------------------------------------
            if gh repo view "${OWNER}/${repo}" >/dev/null 2>&1; then
              echo ""
              echo "ERROR: Repository ${OWNER}/${repo} already exists."
              echo "Workflow stopped to prevent modification."
              exit 1
            fi

            echo "Repository does not exist."

            # --------------------------------------------------
            # Create repository
            # --------------------------------------------------
            gh repo create "${OWNER}/${repo}" \
              --private \
              --description "${{ inputs.description }}"

            echo "Repository created."

            # --------------------------------------------------
            # Clean workspace
            # --------------------------------------------------
            rm -rf .git
            rm -rf .github

            find . -mindepth 1 -maxdepth 1 \
              ! -name 'input_files' \
              -exec rm -rf {} +

            # --------------------------------------------------
            # Generate files from application_template.yaml
            # --------------------------------------------------
            python3 - <<'PY'
          import os
          import yaml
          import re

          template_file = "input_files/application_template.yaml"
          values_file = "input_files/helm_data.yaml"

          with open(template_file, "r") as f:
              template_data = yaml.safe_load(f)

          with open(values_file, "r") as f:
              values = yaml.safe_load(f)

          # --------------------------------------------------
          # Validate template structure
          # --------------------------------------------------
          if not isinstance(template_data, dict):
              raise Exception(
                  "application_template.yaml must contain a YAML mapping."
              )

          if "files" not in template_data:
              raise Exception(
                  "application_template.yaml must contain a 'files' list"
              )

          if not isinstance(template_data["files"], list):
              raise Exception(
                  "'files' in application_template.yaml must be a list"
              )

          # --------------------------------------------------
          # Validate values structure
          # --------------------------------------------------
          if not isinstance(values, dict):
              raise Exception(
                  "helm_data.yaml must contain key/value pairs."
              )

          # --------------------------------------------------
          # Replace variables
          # --------------------------------------------------
          def replace_variables(value):

              if not isinstance(value, str):
                  return value

              pattern = re.compile(
                  r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}"
              )

              def replace(match):

                  key = match.group(1)

                  if key not in values:
                      raise Exception(
                          f"Variable '{key}' is not defined in helm_data.yaml"
                      )

                  return str(values[key])

              return pattern.sub(replace, value)

          # --------------------------------------------------
          # Generate files
          # --------------------------------------------------
          for item in template_data["files"]:

              if not isinstance(item, dict):
                  raise Exception(
                      "Every item in 'files' must be a YAML mapping."
                  )

              if "path" not in item:
                  raise Exception(
                      "Every template file must have a 'path'"
                  )

              if "content" not in item:
                  raise Exception(
                      f"Missing content for file: {item['path']}"
                  )

              path = replace_variables(item["path"])
              content = replace_variables(item["content"])

              # --------------------------------------------------
              # Prevent accidental absolute paths
              # --------------------------------------------------
              if os.path.isabs(path):
                  raise Exception(
                      f"Absolute paths are not allowed: {path}"
                  )

              # --------------------------------------------------
              # Prevent path traversal
              # --------------------------------------------------
              normalized = os.path.normpath(path)

              if normalized.startswith("../") or normalized == "..":
                  raise Exception(
                      f"Path traversal is not allowed: {path}"
                  )

              # --------------------------------------------------
              # Create directory
              # --------------------------------------------------
              os.makedirs(
                  os.path.dirname(path) or ".",
                  exist_ok=True
              )

              # --------------------------------------------------
              # Write file
              # --------------------------------------------------
              with open(path, "w") as f:
                  f.write(content)

              print(f"Created: {path}")

          PY

            # --------------------------------------------------
            # Remove input files from generated repository
            # --------------------------------------------------
            rm -rf input_files

            # --------------------------------------------------
            # Initialize new Git repository
            # --------------------------------------------------
            git init
            git branch -M main

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # --------------------------------------------------
            # Add generated files
            # --------------------------------------------------
            git add .

            echo ""
            echo "Files to be committed:"
            git status --short
            echo ""

            # --------------------------------------------------
            # Commit
            # --------------------------------------------------
            git commit -m "Initial application structure"

            # --------------------------------------------------
            # Add new repository as origin
            # --------------------------------------------------
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git"

            # --------------------------------------------------
            # Push
            # --------------------------------------------------
            git push -u origin main

            echo ""
            echo "Successfully created and pushed:"
            echo "${OWNER}/${repo}"
            echo ""

          done

          echo "=============================================="
          echo "All repositories created successfully."
          echo "=============================================="
